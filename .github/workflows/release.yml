name: Release

on:
  push:
    branches:
      - "main"
    tags:
      - "*"

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: rathole
            features: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            exe: rathole
            features: "vendored-openssl"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            exe: rathole
            features: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            exe: rathole
            features: "vendored-openssl"

          - os: macos-latest
            target: x86_64-apple-darwin
            exe: rathole
            features: ""
          
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: rathole
            features: ""

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: rathole.exe
            features: "vendored-openssl"
          
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            exe: rathole.exe
            features: "vendored-openssl"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      
      - name: Install OpenSSL (Ubuntu)
        if: contains(matrix.os, 'ubuntu') && !contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      
      - name: Install OpenSSL (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install openssl@3
      
      - name: Install MUSL tools
        if: contains(matrix.target, 'musl')
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            sudo apt-get install -y musl-tools
          else
            sudo apt-get update && sudo apt-get install -y musl-tools
          fi

      # Native build
      - name: Run tests
        if: matrix.target != 'aarch64-apple-darwin' && matrix.target != 'aarch64-pc-windows-msvc'
        run: cargo test --release --target ${{ matrix.target }} ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}
      
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}

      - name: Run UPX
        continue-on-error: true
        if: contains(matrix.os, 'ubuntu') && !contains(matrix.target, 'mips')
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true
      
      - name: Compress with UPX
        if: contains(matrix.os, 'ubuntu') && !contains(matrix.target, 'mips')
        run: upx -q --best --lzma target/${{ matrix.target }}/release/${{ matrix.exe }} || true

      - name: Zip Release
        uses: TheDoctor0/zip-release@0.7.6
        with:
          type: zip
          filename: rathole-${{ matrix.target }}.zip
          directory: target/${{ matrix.target }}/release/
          path: ${{ matrix.exe }}

      - uses: actions/upload-artifact@v4
        with:
          name: rathole-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/rathole-${{ matrix.target }}.zip

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(find release-assets -type f -name "*.zip" | tr '\n' ' ')
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            gh release delete nightly --yes --cleanup-tag || true
            gh release create nightly $files \
              --title "Nightly Build" \
              --notes "Automated nightly build from \`${{ github.sha }}\`." \
              --prerelease
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            gh release create "${{ github.ref_name }}" $files \
              --title "Release ${{ github.ref_name }}" \
              --generate-notes
          fi

  docker-build:
    name: Build Docker Image (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: release
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: rathole-${{ matrix.target }}
          path: .
      - name: Prepare binary
        run: |
          unzip rathole-${{ matrix.target }}.zip
          chmod +x rathole
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by arch
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ghcr.io/${{ github.repository }}:${{ matrix.arch }}-${{ github.sha }}

  docker-manifest:
    name: Push Multi-arch Manifest
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create and push multi-arch manifest
        shell: bash
        run: |
          while IFS= read -r tag; do
            docker buildx imagetools create \
              -t "$tag" \
              "ghcr.io/${{ github.repository }}:amd64-${{ github.sha }}" \
              "ghcr.io/${{ github.repository }}:arm64-${{ github.sha }}"
          done <<< "${{ steps.meta.outputs.tags }}"

  publish-crate:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: cargo publish

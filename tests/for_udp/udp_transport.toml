[client]
remote_addr = "127.0.0.1:2337"
user = "default"
token = "default_token_if_not_specify"

[client.transport]
type = "udp"
[client.transport.udp]
psk = "testsecretkey"

[client.services.echo]
type = "udp"
local_addr = "127.0.0.1:8080"
[client.services.pingpong]
type = "udp"
local_addr = "127.0.0.1:8081"

[server]
bind_addr = "0.0.0.0:2337"

[server.users.default]
token = "default_token_if_not_specify"
allowed_ports = "*"

[server.transport]
type = "udp"
[server.transport.udp]
psk = "testsecretkey"

[server.services.echo]
type = "udp"
bind_addr = "0.0.0.0:2334"
[server.services.pingpong]
type = "udp"
bind_addr = "0.0.0.0:2335"
